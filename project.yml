name: Suber
options:
  bundleIdPrefix: com.suber
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
# v1.8.0: Sparkle 2 for in-app auto-update. Public EdDSA key embedded in
# Info.plist (SUPublicEDKey); private key lives in macOS Keychain only.
# generate_appcast (downloaded to ~/.local/sparkle/bin) signs each release
# DMG and writes appcast.xml — see scripts/build-dmg.sh step [9/10].
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Suber:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
    resources:
      - path: Sources/Resources/Fonts
        buildPhase: resources
      # v1.6 Slice 8: String Catalog (Xcode 15+). Single file for all locales
      # — Xcode auto-compiles into per-locale .strings inside the app bundle.
      # Contains EN + zh-Hans translations for v1.6 Autopilot UI.
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.app
        MARKETING_VERSION: "1.9.2"
        CURRENT_PROJECT_VERSION: "192"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Sources/Suber.entitlements
    dependencies:
      - target: SuberWidget
        embed: true
      - package: Sparkle
  SuberWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: SuberWidget
      - path: Sources/Models/Subscription.swift
      - path: Sources/Models/Constants.swift
      - path: Sources/Models/Settings.swift
      - path: Sources/Services/BillingCalculator.swift
      - path: Sources/Utilities/CurrencyFormatter.swift
      # v1.6.2: AppGroupStore replaces UserDefaults(suiteName:) for app-group
      # data sharing — see that file's header for the macOS 26.4 cfprefsd
      # regression. Widget needs to read what main app writes.
      - path: Sources/Services/AppGroupStore.swift
      # v1.9.0: AppGroupStore.set() calls DataBackupManager.snapshot.
      # Widget rarely writes (reads dominate) but the symbol must resolve
      # at compile time, so include the file in the widget target too.
      - path: Sources/Services/DataBackupManager.swift
      # v1.7: IMAP types are referenced by Settings.swift (AutopilotSettings.imapAccount
      # field). Widget never instantiates them — they're just data — but the Codable +
      # Equatable synthesis on AutopilotSettings needs the types in scope.
      - path: Sources/Services/MailWatchdog/IMAPProvider.swift
      - path: Sources/Services/MailWatchdog/IMAPAccount.swift
      # AUDIT-v1.9.2 Q7: widget-rendered strings ("Monthly Spend", cycle
      # labels via shared model files) are localized keys since the U-02
      # backfill, but fell back to English because the catalog only shipped
      # in the app bundle. Extensions resolve strings from their own bundle.
      # NOTE: listed under `sources:` with an explicit buildPhase — xcodegen
      # has no target-level `resources:` key (the app target picks the catalog
      # up via its directory-tree `sources: - path: Sources` entry).
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.app.widget
        MARKETING_VERSION: "1.9.2"
        CURRENT_PROJECT_VERSION: "192"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: SuberWidget/SuberWidget.entitlements
  SuberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Suber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suber.app/Contents/MacOS/Suber"
        BUNDLE_LOADER: "$(TEST_HOST)"
