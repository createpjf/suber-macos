name: SubReminder
options:
  bundleIdPrefix: com.subreminder
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SubReminder:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
    resources:
      - path: Sources/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.subreminder.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Sources/SubReminder.entitlements
    dependencies:
      - target: SubReminderWidget
        embed: true
  SubReminderWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: SubReminderWidget
      - path: Sources/Models/Subscription.swift
      - path: Sources/Models/Constants.swift
      - path: Sources/Models/Settings.swift
      - path: Sources/Services/BillingCalculator.swift
      - path: Sources/Utilities/CurrencyFormatter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.subreminder.app.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: SubReminderWidget/SubReminderWidget.entitlements
  SubReminderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SubReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.subreminder.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SubReminder.app/Contents/MacOS/SubReminder"
        BUNDLE_LOADER: "$(TEST_HOST)"
