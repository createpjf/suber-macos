name: Suber
options:
  bundleIdPrefix: com.suber
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Suber:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
    resources:
      - path: Sources/Resources/Fonts
        buildPhase: resources
      # v1.6 Slice 8: String Catalog (Xcode 15+). Single file for all locales
      # — Xcode auto-compiles into per-locale .strings inside the app bundle.
      # Contains EN + zh-Hans translations for v1.6 Autopilot UI.
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.app
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: "162"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Sources/Suber.entitlements
    dependencies:
      - target: SuberWidget
        embed: true
  SuberWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: SuberWidget
      - path: Sources/Models/Subscription.swift
      - path: Sources/Models/Constants.swift
      - path: Sources/Models/Settings.swift
      - path: Sources/Services/BillingCalculator.swift
      - path: Sources/Utilities/CurrencyFormatter.swift
      # v1.6.2: AppGroupStore replaces UserDefaults(suiteName:) for app-group
      # data sharing — see that file's header for the macOS 26.4 cfprefsd
      # regression. Widget needs to read what main app writes.
      - path: Sources/Services/AppGroupStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.app.widget
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: "162"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: SuberWidget/SuberWidget.entitlements
  SuberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Suber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suber.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suber.app/Contents/MacOS/Suber"
        BUNDLE_LOADER: "$(TEST_HOST)"
